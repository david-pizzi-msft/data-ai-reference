site_name: Data & AI Reference
site_description: Personal quick-reference for Microsoft Fabric, Fabric IQ, and Agentic AI
site_author: David Pizzi
site_url: https://david-pizzi-msft.github.io/data-ai-reference/
repo_url: https://github.com/david-pizzi-msft/data-ai-reference
repo_name: david-pizzi-msft/data-ai-reference
copyright: Copyright &copy; 2026 David Pizzi

theme:
  name: material
  logo: assets/microsoft-logo.svg
  favicon: assets/microsoft-logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Segoe UI
    code: Cascadia Code
  palette:
    # Light mode (default)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode (opt-in via toggle)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/david-pizzi-msft
      name: GitHub

